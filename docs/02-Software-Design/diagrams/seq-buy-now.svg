<rect x="70.38" y="171" width="304.24" height="15" fill="#ffffff"/>
<text x="222.5" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="222.5" dy="0">2. confirm dialog: title and full listed price</tspan></text>
<line x1="335" y1="192" x2="111" y2="192" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
