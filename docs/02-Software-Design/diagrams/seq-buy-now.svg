<text x="222.5" y="211" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="222.5" dy="0">3. Send request at the listed price</tspan></text>
<line x1="110" y1="224" x2="334" y2="224" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="346.9" y="235" width="201.20000000000002" height="15" fill="#ffffff"/>
<text x="447.5" y="243" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="0">4. POST /api/requests {bookId}</tspan></text>
<line x1="335" y1="256" x2="559" y2="256" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="507.5" y="267" width="330.00000000000006" height="29" fill="#ffffff"/>
<text x="672.5" y="282" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">5. load book; refuse own listing, non-active book,</tspan><tspan x="672.5" dy="14.375">or an open request by this buyer</tspan></text>
<line x1="560" y1="302" x2="784" y2="302" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="497.84" y="313" width="349.32000000000005" height="29" fill="#ffffff"/>
<text x="672.5" y="328" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">6. PurchaseRequest.create(price = listPrice, pending,</tspan><tspan x="672.5" dy="14.375">offer by buyer)  [unique partial index]</tspan></text>
<line x1="560" y1="348" x2="784" y2="348" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="501.05999999999995" y="359" width="342.88000000000005" height="15" fill="#ffffff"/>
<text x="672.5" y="367" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="0">7. open conversation, post offer card, notify seller</tspan></text>
<line x1="560" y1="380" x2="784" y2="380" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="391.98" y="391" width="111.04" height="15" fill="#ffffff"/>
<text x="447.5" y="399" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="0">8. 201 {request}</tspan></text>
<line x1="560" y1="412" x2="336" y2="412" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="321.14" y="423" width="252.72000000000003" height="15" fill="#ffffff"/>
<text x="447.5" y="431" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="0">9. POST /api/requests/:id/conversation</tspan></text>
<line x1="335" y1="444" x2="559" y2="444" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="109.02" y="455" width="226.96" height="15" fill="#ffffff"/>
<text x="222.5" y="463" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="222.5" dy="0">10. open the chat for this request</tspan></text>
