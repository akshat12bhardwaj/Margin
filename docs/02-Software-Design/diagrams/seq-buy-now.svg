<rect x="566" y="577" width="284.92" height="15" fill="#ffffff"/>
<text x="570" y="585" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="570" dy="0">12. afterBuyerAction: full price, so accept</tspan></text>
