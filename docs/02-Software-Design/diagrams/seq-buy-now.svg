n x="560" dy="15.625">(routes/requests.js)</tspan></text><line x1="785" y1="114" x2="785" y2="972" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="692.5" y="50" width="185.00000000000003" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="785" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="-15.625">MongoDB</tspan><tspan x="785" dy="15.625">books, requests,</tspan><tspan x="785" dy="15.625">conversations, messages</tspan></text><line x1="1010" y1="114" x2="1010" y2="972" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><circle cx="1010" cy="64" r="8" stroke="#2f4436" stroke-width="1.6" fill="none" fill="#ffffff"/><line x1="1010" y1="72" x2="1010" y2="90" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="997" y1="78" x2="1023" y2="78" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="1010" y1="90" x2="1000" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="1010" y1="90" x2="1020" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><text x="1010" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="1010" dy="0">Seller</tspan></text><rect x="186.3" y="139" width="72.4" height="15" fill="#ffffff"/>
<text x="222.5" y="147" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="222.5" dy="0">1. Buy now</tspan></text>
