<rect x="671.52" y="517" width="226.96" height="15" fill="#ffffff"/>
<text x="785" y="525" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="0">11. PATCH /api/requests/:id/accept</tspan></text>
