<text x="522" y="506" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#7a5a3a" dominant-baseline="central"><tspan x="522" dy="0">[genuine seller]</tspan></text>
<line x1="465" y1="560" x2="1105" y2="560" stroke="#7a5a3a" stroke-width="1" stroke-dasharray="6 4"/>
<text x="475" y="571" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#7a5a3a" dominant-baseline="central"><tspan x="475" dy="0">[automated example seller]</tspan></text>
<rect x="513.94" y="647" width="317.12" height="15" fill="#ffffff"/>
<text x="672.5" y="655" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="0">13. book: active → reserved (conditional update)</tspan></text>
<line x1="560" y1="668" x2="784" y2="668" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="507.5" y="679" width="330.00000000000006" height="29" fill="#ffffff"/>
<text x="672.5" y="694" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">14. request: pending → accepted (compare-and-set);</tspan><tspan x="672.5" dy="14.375">accepted card + notification</tspan></text>
<line x1="560" y1="714" x2="784" y2="714" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="131.35999999999999" y="755" width="407.28000000000003" height="15" fill="#ffffff"/>
<text x="335" y="763" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="335" dy="0">15. POST /api/conversations/:id/messages (meeting place, time)</tspan></text>
<line x1="110" y1="776" x2="559" y2="776" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="648.98" y="787" width="272.04" height="15" fill="#ffffff"/>
<text x="785" y="795" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="0">16. message + unread count + notification</tspan></text>
<line x1="560" y1="808" x2="1009" y2="808" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
