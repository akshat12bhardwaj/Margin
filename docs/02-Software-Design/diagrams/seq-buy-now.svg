<path d="M15,734 h58 v12 l-8,8 H15 z" fill="#f6ede3" stroke="#7a5a3a" stroke-width="1.2"/><text x="23" y="744" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#7a5a3a" dominant-baseline="central"><tspan x="23" dy="0">loop</tspan></text>
<text x="81" y="744" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#7a5a3a" dominant-baseline="central"><tspan x="81" dy="0">[until the exchange]</tspan></text>
<rect x="558.8199999999999" y="837" width="452.36000000000007" height="15" fill="#ffffff"/>
<text x="785" y="845" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="0">17. PATCH /api/requests/:id/complete (after handover, paid in person)</tspan></text>
<line x1="1010" y1="858" x2="561" y2="858" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="517.16" y="869" width="310.68" height="29" fill="#ffffff"/>
<text x="672.5" y="884" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">18. book: reserved → sold; request → completed;</tspan><tspan x="672.5" dy="14.375">cancel other open requests</tspan></text>
<line x1="560" y1="904" x2="784" y2="904" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="205.42" y="915" width="259.16" height="15" fill="#ffffff"/>
<text x="335" y="923" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="335" dy="0">19. notification: marked as sold to you</tspan></text>
<line x1="560" y1="936" x2="111" y2="936" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/></svg>