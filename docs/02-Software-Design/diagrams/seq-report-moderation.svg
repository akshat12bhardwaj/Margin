</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="560" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="560" dy="0">Figure 2.8  Sequence: report a listing and administrator moderation</tspan></text><line x1="110" y1="114" x2="110" y2="679" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><circle cx="110" cy="64" r="8" stroke="#2f4436" stroke-width="1.6" fill="none" fill="#ffffff"/><line x1="110" y1="72" x2="110" y2="90" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="97" y1="78" x2="123" y2="78" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="110" y1="90" x2="100" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="110" y1="90" x2="120" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><text x="110" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="110" dy="0">Member</tspan></text><line x1="335" y1="114" x2="335" y2="679" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="256.5" y="50" width="157" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="335" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="335" dy="-7.8125">Reports API</tspan><tspan x="335" dy="15.625">(routes/reports.js)</tspan></text><line x1="560" y1="114" x2="560" y2="679" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="495.5" y="50" width="129" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="560" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="560" dy="-15.625">MongoDB</tspan><tspan x="560" dy="15.625">reports, books,</tspan><tspan x="560" dy="15.625">audit logs</tspan></text><line x1="785" y1="114" x2="785" y2="679" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="713.5" y="50" width="143" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="785" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="-7.8125">Admin API</tspan><tspan x="785" dy="15.625">(routes/admin.js)</tspan></text><line x1="1010" y1="114" x2="1010" y2="679" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><circle cx="1010" cy="64" r="8" stroke="#2f4436" stroke-width="1.6" fill="none" fill="#ffffff"/><line x1="1010" y1="72" x2="1010" y2="90" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="997" y1="78" x2="1023" y2="78" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="1010" y1="90" x2="1000" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="1010" y1="90" x2="1020" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><text x="1010" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="1010" dy="0">Administrator</tspan></text><rect x="60.72" y="139" width="323.56" height="29" fill="#ffffff"/>
<text x="222.5" y="154" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="222.5" dy="-7.1875">1. POST /api/reports {targetType: book, targetId,</tspan><tspan x="222.5" dy="14.375">category, description}</tspan></text>
<line x1="110" y1="174" x2="334" y2="174" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="279.28" y="185" width="336.44000000000005" height="29" fill="#ffffff"/>
<text x="447.5" y="200" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="-7.1875">2. listing exists, not own, not an example listing,</tspan><tspan x="447.5" dy="14.375">no open report by this member on it</tspan></text>
<line x1="335" y1="220" x2="559" y2="220" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="272.84" y="231" width="349.32000000000005" height="15" fill="#ffffff"/>
<text x="447.5" y="239" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="0">3. Report.create(status pending); book.flagged = true</tspan></text>
<line x1="335" y1="252" x2="559" y2="252" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="144.44" y="263" width="156.12" height="15" fill="#ffffff"/>
<text x="222.5" y="271" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="222.5" dy="0">4. 201 Report submitted</tspan></text>
<line x1="335" y1="284" x2="111" y2="284" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="713.18" y="295" width="368.64000000000004" height="15" fill="#ffffff"/>
<text x="897.5" y="303" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="897.5" dy="0">5. GET /api/admin/reports?status=pending  (requireAdmin)</tspan></text>
<line x1="1010" y1="316" x2="786" y2="316" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="751.8199999999999" y="327" width="291.36" height="15" fill="#ffffff"/>
<text x="897.5" y="335" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="897.5" dy="0">6. reports with reporter, target and listing</tspan></text>
<line x1="785" y1="348" x2="1009" y2="348" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="719.62" y="359" width="355.76000000000005" height="15" fill="#ffffff"/>
<text x="897.5" y="367" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="897.5" dy="0">7. PATCH /api/admin/reports/:id {status: under_review}</tspan></text>
<line x1="1010" y1="380" x2="786" y2="380" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="520.38" y="391" width="304.24" height="15" fill="#ffffff"/>
<text x="672.5" y="399" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="0">8. update report; AuditLog report.under_review</tspan></text>
<line x1="785" y1="412" x2="561" y2="412" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="755.04" y="423" width="284.92" height="15" fill="#ffffff"/>
<text x="897.5" y="431" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="897.5" dy="0">9. PATCH /api/admin/books/:id/hide {reason}</tspan></text>
<line x1="1010" y1="444" x2="786" y2="444" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="484.96" y="455" width="375.08000000000004" height="29" fill="#ffffff"/>
<text x="672.5" y="470" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">10. book → hidden (only from active, inactive, reserved);</tspan><tspan x="672.5" dy="14.375">cancel open requests; AuditLog book.hide</tspan></text>
<line x1="785" y1="490" x2="561" y2="490" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<path d="M556.48,512 H1003.52 L1013.52,522 V537 H556.48 Z" fill="#fff8dc" stroke="#5b6b5f" stroke-width="1"/>
<text x="785" y="524.5" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="0">The listing's seller (another member) is notified with the reason.</tspan></text>
<rect x="697.0799999999999" y="544" width="400.84000000000003" height="15" fill="#ffffff"/>
<text x="897.5" y="552" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="897.5" dy="0">11. PATCH /api/admin/reports/:id {status: resolved, decision}</tspan></text>
<line x1="1010" y1="565" x2="786" y2="565" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="488.17999999999995" y="576" width="368.64000000000004" height="29" fill="#ffffff"/>
<text x="672.5" y="591" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">12. close report (final); unflag the book when no report</tspan><tspan x="672.5" dy="14.375">is open; AuditLog report.resolved</tspan></text>
<line x1="785" y1="611" x2="561" y2="611" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="266.4" y="622" width="362.20000000000005" height="15" fill="#ffffff"/>
<text x="447.5" y="630" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="0">13. notify reporter (and the reported user when upheld)</tspan></text>
<line x1="785" y1="643" x2="111" y2="643" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/></svg>