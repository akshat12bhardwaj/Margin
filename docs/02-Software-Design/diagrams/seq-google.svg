<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="918" viewBox="0 0 1080 918"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f4436"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2f4436" stroke-width="1.4"/></marker>
  <marker id="triangle" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#2f4436" stroke-width="1.2"/></marker>
  <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M0,5 L8,0 L16,5 L8,10 z" fill="#2f4436"/></marker>
</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="540" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="540" dy="0">Figure 2.4  Sequence: sign in with Google (OAuth 2.0 authorization code)</tspan></text><line x1="110" y1="114" x2="110" y2="898" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><circle cx="110" cy="64" r="8" stroke="#2f4436" stroke-width="1.6" fill="none" fill="#ffffff"/><line x1="110" y1="72" x2="110" y2="90" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="97" y1="78" x2="123" y2="78" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="110" y1="90" x2="100" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="110" y1="90" x2="120" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><text x="110" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="110" dy="0">Visitor or member</tspan></text><line x1="325" y1="114" x2="325" y2="898" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="265" y="50" width="120" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="325" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="325" dy="0">React client</tspan></text><line x1="540" y1="114" x2="540" y2="898" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="480" y="50" width="120" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="540" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="540" dy="0">Auth API</tspan></text><line x1="755" y1="114" x2="755" y2="898" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="680" y="50" width="150" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="755" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="755" dy="-7.8125">Google OAuth</tspan><tspan x="755" dy="15.625">and OpenID Connect</tspan></text><line x1="970" y1="114" x2="970" y2="898" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="910" y="50" width="120" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="970" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="970" dy="-7.8125">MongoDB</tspan><tspan x="970" dy="15.625">users</tspan></text><rect x="139.44" y="139" width="156.12" height="15" fill="#ffffff"/>
<text x="217.5" y="147" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="217.5" dy="0">1. Continue with Google</tspan></text>
<line x1="110" y1="160" x2="324" y2="160" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="354.44" y="171" width="156.12" height="15" fill="#ffffff"/>
<text x="432.5" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="432.5" dy="0">2. GET /api/auth/google</tspan></text>
<line x1="325" y1="192" x2="539" y2="192" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="277.15999999999997" y="203" width="310.68" height="15" fill="#ffffff"/>
<text x="432.5" y="211" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="432.5" dy="0">3. 302 to Google + random state cookie (10 min)</tspan></text>
<line x1="540" y1="224" x2="326" y2="224" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="335.12" y="235" width="194.76000000000002" height="15" fill="#ffffff"/>
<text x="432.5" y="243" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="432.5" dy="0">4. choose account and consent</tspan></text>
<line x1="110" y1="256" x2="754" y2="256" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="505.03999999999996" y="267" width="284.92" height="15" fill="#ffffff"/>
<text x="647.5" y="275" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="647.5" dy="0">5. GET /api/auth/google/callback?code&amp;state</tspan></text>
<line x1="755" y1="288" x2="541" y2="288" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="546" y="299" width="201.20000000000002" height="15" fill="#ffffff"/>
<text x="550" y="307" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="550" dy="0">6. state must equal the cookie</tspan></text>
<path d="M540,320 h40 v24 h-40" fill="none" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="501.82" y="351" width="291.36" height="15" fill="#ffffff"/>
<text x="647.5" y="359" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="647.5" dy="0">7. POST token endpoint (code, client secret)</tspan></text>
<line x1="540" y1="372" x2="754" y2="372" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="514.7" y="383" width="265.6" height="15" fill="#ffffff"/>
<text x="647.5" y="391" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="647.5" dy="0">8. ID token (sub, email, email_verified)</tspan></text>
<line x1="755" y1="404" x2="541" y2="404" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="546" y="415" width="272.04" height="15" fill="#ffffff"/>
<text x="550" y="423" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="550" dy="0">9. check audience, issuer, verified email</tspan></text>
<path d="M540,436 h40 v24 h-40" fill="none" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="622.2" y="467" width="265.6" height="15" fill="#ffffff"/>
<text x="755" y="475" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="755" dy="0">10. find user by googleId, else by email</tspan></text>
<line x1="540" y1="488" x2="969" y2="488" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="618.98" y="529" width="272.04" height="29" fill="#ffffff"/>
<text x="755" y="544" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="755" dy="-7.1875">11. first Google sign-in: store googleId,</tspan><tspan x="755" dy="14.375">remove password, end older sessions</tspan></text>
<line x1="540" y1="564" x2="969" y2="564" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="302.91999999999996" y="575" width="259.16" height="15" fill="#ffffff"/>
<text x="432.5" y="583" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="432.5" dy="0">12. session cookie, redirect /dashboard</tspan></text>
<line x1="540" y1="596" x2="326" y2="596" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="235.29999999999998" y="635" width="394.40000000000003" height="15" fill="#ffffff"/>
<text x="432.5" y="643" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="432.5" dy="0">13. signed signup cookie (15 min), redirect /register/google</tspan></text>
<line x1="540" y1="656" x2="326" y2="656" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="97.57999999999998" y="667" width="239.84000000000003" height="15" fill="#ffffff"/>
<text x="217.5" y="675" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="217.5" dy="0">14. choose role, programme, semester</tspan></text>
<line x1="110" y1="688" x2="324" y2="688" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="319.02" y="699" width="226.96" height="15" fill="#ffffff"/>
<text x="432.5" y="707" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="432.5" dy="0">15. POST /api/auth/google/complete</tspan></text>
<line x1="325" y1="720" x2="539" y2="720" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="612.54" y="731" width="284.92" height="15" fill="#ffffff"/>
<text x="755" y="739" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="755" dy="0">16. create user with googleId (no password)</tspan></text>
<line x1="540" y1="752" x2="969" y2="752" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="351.22" y="763" width="162.56" height="15" fill="#ffffff"/>
<text x="432.5" y="771" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="432.5" dy="0">17. 201 + session cookie</tspan></text>
<line x1="540" y1="784" x2="326" y2="784" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="335.12" y="823" width="194.76000000000002" height="15" fill="#ffffff"/>
<text x="432.5" y="831" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="432.5" dy="0">18. redirect /login?error=...</tspan></text>
<line x1="540" y1="844" x2="326" y2="844" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="15" y="508" width="1050" height="362" fill="none" stroke="#7a5a3a" stroke-width="1.2"/>
<path d="M15,508 h49 v12 l-8,8 H15 z" fill="#f6ede3" stroke="#7a5a3a" stroke-width="1.2"/><text x="23" y="518" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#7a5a3a" dominant-baseline="central"><tspan x="23" dy="0">alt</tspan></text>
<text x="72" y="518" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#7a5a3a" dominant-baseline="central"><tspan x="72" dy="0">[existing student or faculty account]</tspan></text>
<line x1="15" y1="618" x2="1065" y2="618" stroke="#7a5a3a" stroke-width="1" stroke-dasharray="6 4"/>
<text x="25" y="629" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#7a5a3a" dominant-baseline="central"><tspan x="25" dy="0">[no account yet]</tspan></text>
<line x1="15" y1="806" x2="1065" y2="806" stroke="#7a5a3a" stroke-width="1" stroke-dasharray="6 4"/>
<text x="25" y="817" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#7a5a3a" dominant-baseline="central"><tspan x="25" dy="0">[admin, deactivated or different Google identity]</tspan></text></svg>