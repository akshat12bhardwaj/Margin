js)</tspan></text><line x1="755" y1="114" x2="755" y2="792" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="683.5" y="50" width="143" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="755" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="755" dy="-7.8125">Upload middleware</tspan><tspan x="755" dy="15.625">and storage</tspan></text><line x1="970" y1="114" x2="970" y2="792" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="910" y="50" width="120" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="970" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="970" dy="-7.8125">MongoDB</tspan><tspan x="970" dy="15.625">books</tspan></text><rect x="58.94" y="139" width="317.12" height="29" fill="#ffffff"/>
