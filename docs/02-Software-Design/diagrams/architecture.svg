<rect x="70" y="100" width="300" height="160" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="220" y="180" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="220" dy="-22.5">React 19 single-page app (Vite)</tspan><tspan x="220" dy="15">client/src/pages · components · context</tspan><tspan x="220" dy="15">React Router 7 · api.js (fetch, JSON)</tspan><tspan x="220" dy="15">hooks.js (useFetch, useForm)</tspan></text>
