<rect x="70" y="695" width="1200" height="30" rx="4" fill="#fbfaf5" stroke="#2f4436" stroke-width="1.4"/><text x="670" y="710" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="670" dy="0">server/scripts: create-admin · seed-demo · remove-demo · migrate-subjects (run from the command line against MongoDB)</tspan></text>
