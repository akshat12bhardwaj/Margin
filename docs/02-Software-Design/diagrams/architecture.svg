<rect x="970" y="510" width="180" height="60" rx="4" fill="#f4efe2" stroke="#2f4436" stroke-width="1.4"/><text x="1060" y="540" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="1060" dy="-7.5">server/uploads</tspan><tspan x="1060" dy="15">(listing photos)</tspan></text>
