<rect x="600" y="100" width="670" height="60" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="935" y="130" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="935" dy="-7.5">app.js: helmet (security headers, CSP) · express.json (100 kB) · cookie-parser · loadUser (JWT cookie)</tspan><tspan x="935" dy="15">static /uploads · built client for production · central error handler</tspan></text>
<rect x="600" y="185" width="670" height="70" rx="4" fill="#fbfaf5" stroke="#2f4436" stroke-width="1.4"/><text x="935" y="220" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="935" dy="-7.5">REST routers under /api: auth · users · books · wishlist · requests · conversations · notifications · reports · admin</tspan><tspan x="935" dy="15">middleware: validate (zod) · requireAuth / requireMember / requireAdmin · uploadImages (multer) · rate limits</tspan></text>
<rect x="600" y="280" width="670" height="60" rx="4" fill="#fbfaf5" stroke="#2f4436" stroke-width="1.4"/><text x="935" y="310" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="935" dy="-7.5">lib services: requests (cancelOpenRequests) · messages (conversationFor, postEvent) · notify · autoSeller (rules)</tspan><tspan x="935" dy="15">storage (disk or Cloudinary) · mail (SMTP or console) · schemas · http errors</tspan></text>
<rect x="600" y="365" width="670" height="50" rx="4" fill="#fbfaf5" stroke="#2f4436" stroke-width="1.4"/><text x="935" y="390" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="935" dy="0">Mongoose 9 models: User · Book · PurchaseRequest · Conversation · Message · Wishlist · Report · Notification · AuditLog</tspan></text>
