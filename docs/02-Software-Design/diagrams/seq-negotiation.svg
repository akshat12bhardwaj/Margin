<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="874" viewBox="0 0 1120 874"><defs>
  <marker id="arrow" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#2f4436"/></marker>
  <marker id="open" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="10" markerHeight="10" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10" fill="none" stroke="#2f4436" stroke-width="1.4"/></marker>
  <marker id="triangle" viewBox="0 0 12 12" refX="12" refY="6" markerWidth="14" markerHeight="14" orient="auto-start-reverse"><path d="M0,0 L12,6 L0,12 z" fill="#ffffff" stroke="#2f4436" stroke-width="1.2"/></marker>
  <marker id="diamond" viewBox="0 0 16 10" refX="0" refY="5" markerWidth="16" markerHeight="10" orient="auto-start-reverse"><path d="M0,5 L8,0 L16,5 L8,10 z" fill="#2f4436"/></marker>
</defs><rect width="100%" height="100%" fill="#ffffff"/><text x="560" y="22" font-family="Arial, Helvetica, sans-serif" font-size="15" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="560" dy="0">Figure 2.7  Sequence: price negotiation (offer, counteroffer, accept)</tspan></text><line x1="110" y1="114" x2="110" y2="854" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><circle cx="110" cy="64" r="8" stroke="#2f4436" stroke-width="1.6" fill="none" fill="#ffffff"/><line x1="110" y1="72" x2="110" y2="90" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="97" y1="78" x2="123" y2="78" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="110" y1="90" x2="100" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="110" y1="90" x2="120" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><text x="110" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="110" dy="0">Buyer</tspan></text><line x1="335" y1="114" x2="335" y2="854" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="274" y="50" width="122.00000000000001" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="335" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="335" dy="-7.8125">Chat</tspan><tspan x="335" dy="15.625">(Messages.jsx)</tspan></text><line x1="560" y1="114" x2="560" y2="854" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="500" y="50" width="120" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="560" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="560" dy="0">Requests API</tspan></text><line x1="785" y1="114" x2="785" y2="854" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="717" y="50" width="136" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="785" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="-15.625">MongoDB</tspan><tspan x="785" dy="15.625">requests, books,</tspan><tspan x="785" dy="15.625">messages</tspan></text><line x1="1010" y1="114" x2="1010" y2="854" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><circle cx="1010" cy="64" r="8" stroke="#2f4436" stroke-width="1.6" fill="none" fill="#ffffff"/><line x1="1010" y1="72" x2="1010" y2="90" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="997" y1="78" x2="1023" y2="78" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="1010" y1="90" x2="1000" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><line x1="1010" y1="90" x2="1020" y2="102" stroke="#2f4436" stroke-width="1.6" fill="none"/><text x="1010" y="126" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="1010" dy="0">Seller</tspan></text><rect x="92.91999999999999" y="139" width="259.16" height="15" fill="#ffffff"/>
<text x="222.5" y="147" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="222.5" dy="0">1. Make an offer: ₹400 (listed at ₹490)</tspan></text>
<line x1="110" y1="160" x2="334" y2="160" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="308.26" y="171" width="278.48" height="15" fill="#ffffff"/>
<text x="447.5" y="179" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="0">2. POST /api/requests {bookId, offer: 400}</tspan></text>
<line x1="335" y1="192" x2="559" y2="192" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="566" y="203" width="330.00000000000006" height="15" fill="#ffffff"/>
<text x="570" y="211" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="570" dy="0">3. offer must be a whole number, 0 to listed price</tspan></text>
<path d="M560,224 h40 v24 h-40" fill="none" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="481.74" y="255" width="381.52000000000004" height="15" fill="#ffffff"/>
<text x="672.5" y="263" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="0">4. create request: price 400, listPrice 490, offerBy buyer</tspan></text>
<line x1="560" y1="276" x2="784" y2="276" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="665.0799999999999" y="287" width="239.84000000000003" height="15" fill="#ffffff"/>
<text x="785" y="295" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="0">5. offer card in chat + notification</tspan></text>
<line x1="560" y1="308" x2="1009" y2="308" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<path d="M395.67999999999995,330 H939.32 L949.32,340 V370 H395.67999999999995 Z" fill="#fff8dc" stroke="#5b6b5f" stroke-width="1"/>
<text x="672.5" y="350" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">Automated seller (lib/autoSeller.js decide): accept at ≥ 90% of the listed price,</tspan><tspan x="672.5" dy="14.375">decline below 60%, otherwise counter halfway, rounded to ₹10, never below 90%.</tspan></text>
<rect x="626.44" y="377" width="317.12" height="15" fill="#ffffff"/>
<text x="785" y="385" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="0">6. PATCH /api/requests/:id/counter {amount: 450}</tspan></text>
<line x1="1010" y1="398" x2="561" y2="398" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="566" y="409" width="336.44000000000005" height="29" fill="#ffffff"/>
<text x="570" y="424" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="570" dy="-7.1875">7. responder check: only the party who did not make</tspan><tspan x="570" dy="14.375">the current offer may answer it</tspan></text>
<path d="M560,444 h40 v24 h-40" fill="none" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="465.64" y="475" width="413.72" height="29" fill="#ffffff"/>
<text x="672.5" y="490" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">8. findOneAndUpdate where {pending, offerBy: buyer, price: 400}</tspan><tspan x="672.5" dy="14.375">set price 450, offerBy seller</tspan></text>
<line x1="560" y1="510" x2="784" y2="510" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="636.1" y="551" width="297.8" height="15" fill="#ffffff"/>
<text x="785" y="559" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="785" dy="0">9. 409 This offer has changed. Please reload.</tspan></text>
<line x1="560" y1="572" x2="1009" y2="572" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="198.98" y="611" width="272.04" height="15" fill="#ffffff"/>
<text x="335" y="619" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="335" dy="0">10. counteroffer card ₹450 + notification</tspan></text>
<line x1="560" y1="632" x2="111" y2="632" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<rect x="15" y="530" width="1090" height="128" fill="none" stroke="#7a5a3a" stroke-width="1.2"/>
<path d="M15,530 h49 v12 l-8,8 H15 z" fill="#f6ede3" stroke="#7a5a3a" stroke-width="1.2"/><text x="23" y="540" font-family="Arial, Helvetica, sans-serif" font-size="12" text-anchor="start" font-weight="bold" fill="#7a5a3a" dominant-baseline="central"><tspan x="23" dy="0">alt</tspan></text>
<text x="72" y="540" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#7a5a3a" dominant-baseline="central"><tspan x="72" dy="0">[offer changed meanwhile (no match)]</tspan></text>
<line x1="15" y1="594" x2="1105" y2="594" stroke="#7a5a3a" stroke-width="1" stroke-dasharray="6 4"/>
<text x="25" y="605" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="start" font-weight="normal" font-style="italic" fill="#7a5a3a" dominant-baseline="central"><tspan x="25" dy="0">[updated]</tspan></text>
<rect x="221.51999999999998" y="661" width="226.96" height="15" fill="#ffffff"/>
<text x="335" y="669" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="335" dy="0">11. PATCH /api/requests/:id/accept</tspan></text>
<line x1="110" y1="682" x2="559" y2="682" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="533.26" y="693" width="278.48" height="29" fill="#ffffff"/>
<text x="672.5" y="708" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="672.5" dy="-7.1875">12. reserve book (active → reserved), then</tspan><tspan x="672.5" dy="14.375">request accepted at ₹450</tspan></text>
<line x1="560" y1="728" x2="784" y2="728" stroke="#2f4436" stroke-width="1.3" marker-end="url(#arrow)"/>
<rect x="295.38" y="739" width="304.24" height="15" fill="#ffffff"/>
<text x="447.5" y="747" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="0">13. accepted card; deal strip "Agreed at ₹450"</tspan></text>
<line x1="560" y1="760" x2="336" y2="760" stroke="#2f4436" stroke-width="1.3" stroke-dasharray="6 4" marker-end="url(#open)"/>
<path d="M173.89999999999998,782 H711.1 L721.1,792 V822 H173.89999999999998 Z" fill="#fff8dc" stroke="#5b6b5f" stroke-width="1"/>
<text x="447.5" y="802" font-family="Arial, Helvetica, sans-serif" font-size="11.5" text-anchor="middle" font-weight="normal" fill="#1c2b20" dominant-baseline="central"><tspan x="447.5" dy="-7.1875">The chat stays open after agreement for arranging the handover. The agreed price</tspan><tspan x="447.5" dy="14.375">only changes if a new request is made after this one is cancelled.</tspan></text></svg>