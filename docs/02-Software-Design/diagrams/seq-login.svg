span></text><line x1="830" y1="114" x2="830" y2="898" stroke="#5b6b5f" stroke-width="1" stroke-dasharray="5 4"/><rect x="770" y="50" width="120" height="58" rx="4" fill="#e6ecdf" stroke="#2f4436" stroke-width="1.4"/><text x="830" y="79" font-family="Arial, Helvetica, sans-serif" font-size="12.5" text-anchor="middle" font-weight="bold" fill="#1c2b20" dominant-baseline="central"><tspan x="830" dy="-7.8125">MongoDB</tspan><tspan x="830" dy="15.625">users</tspan></text><rect x="139.06" y="139" width="181.88000000000002" height="15" fill="#ffffff"/>
